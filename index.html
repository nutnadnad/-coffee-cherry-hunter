<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Cherry Color Hunter</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3D2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cherry Hunter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--leaf:#1F3D2B;--moss:#3E6B3A;--mist:#E6EFDD;--paper:#F8FBF4;--ink:#17301F;--ok:#1E8E3E;--near:#C77700;--bad:#B3261E;--c1:#E10600;
--font:"Noto Sans Thai UI","Noto Sans Thai","Sarabun","Leelawadee UI","Thonburi",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--mist);color:var(--ink);line-height:1.5;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:30rem;margin:0 auto;padding-bottom:2rem}
header{background:var(--leaf);color:#F1F7E8;padding:1.1rem 1.25rem .4rem}
header h1{font-size:1.55rem;font-weight:800;line-height:1.2}
header p{font-size:.85rem;opacity:.8}
.hero{background:var(--leaf);padding:0 1rem 1rem}
.hero svg{width:100%;height:auto;display:block}
.stat{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1.25rem;font-weight:700}
.stat span{font-weight:500;font-size:.9rem}
.missions{display:flex;gap:.5rem;padding:0 1.25rem}
.missions button{flex:1;border:2px solid var(--moss);background:transparent;color:var(--ink);border-radius:.7rem;padding:.4rem;font:inherit;font-size:.85rem;font-weight:600}
.missions button[aria-current=true]{background:var(--moss);color:#fff}
.missions button:disabled{opacity:.45;border-style:dashed}
.card{margin:1rem 1.25rem 0}
.target h2{font-size:1.15rem}
.target p{font-size:.9rem;color:#37533f}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.8rem}
.sw{height:7.5rem;border-radius:1rem;display:flex;align-items:flex-end;padding:.5rem .7rem;font-size:.85rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);border:3px solid var(--paper)}
.sw small{display:block;font-weight:500;opacity:.95}
.row{display:flex;align-items:center;gap:.7rem;margin-top:.7rem}
.row label{width:4.2rem;font-size:.9rem;font-weight:600}
input[type=range]{flex:1;height:2rem;accent-color:var(--moss)}
#hue{appearance:none;-webkit-appearance:none;height:1.1rem;border-radius:1rem;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:1.7rem;height:1.7rem;border-radius:50%;background:#fff;border:3px solid var(--leaf)}
#hue::-moz-range-thumb{width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;border:3px solid var(--leaf)}
#hex{font:inherit;font-weight:700;letter-spacing:.05em;text-transform:uppercase;width:7.5rem;padding:.45rem .6rem;border:2px solid var(--moss);border-radius:.6rem;background:var(--paper);color:var(--ink)}
#status{margin:1rem 1.25rem 0;border-radius:1rem;padding:.9rem 1rem;display:flex;gap:.8rem;align-items:flex-start;background:var(--paper);border:3px solid transparent}
#status .ic{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;font-weight:800;color:#fff}
#status b{display:block;font-size:1.02rem}
#status small{color:#37533f;font-size:.85rem}
#status.pass{border-color:var(--ok)}#status.pass .ic{background:var(--ok)}
#status.near{border-color:var(--near)}#status.near .ic{background:var(--near)}
#status.bad{border-color:var(--bad)}#status.bad .ic{background:var(--bad)}
.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.9)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.bounce .cherry{animation:bob .7s ease 2;transform-box:fill-box;transform-origin:50% 0}
@keyframes bob{50%{transform:translateY(7px) rotate(4deg)}}
.btns{display:flex;gap:.6rem;margin:1rem 1.25rem 0}
.btn{flex:1;border:0;border-radius:.9rem;padding:.85rem;font:inherit;font-weight:700;font-size:1rem;background:var(--leaf);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--moss)}
.btn[hidden]{display:none}
.tol{font-size:.85rem}
.tol output{font-weight:700}
.note{margin:.9rem 1.25rem 0;font-size:.8rem;color:#4b6652}
.link{background:none;border:0;font:inherit;font-size:.8rem;color:#4b6652;text-decoration:underline;margin:.5rem 1.25rem 0}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<header><h1>Coffee Cherry Color Hunter</h1><p>Trail to Cup – Coffee Explorer</p></header>
<div class="hero" id="hero" aria-hidden="true">
<svg viewBox="0 0 320 150">
<path d="M0 22 C60 30 110 18 170 34 S280 40 320 26" fill="none" stroke="#6B4A2B" stroke-width="7" stroke-linecap="round"/>
<g fill="#5E9B45"><ellipse cx="45" cy="18" rx="30" ry="11" transform="rotate(-18 45 18)"/><ellipse cx="130" cy="42" rx="32" ry="11" transform="rotate(20 130 42)"/><ellipse cx="215" cy="20" rx="30" ry="11" transform="rotate(-14 215 20)"/><ellipse cx="290" cy="45" rx="28" ry="10" transform="rotate(22 290 45)"/></g>
<g stroke="#6B4A2B" stroke-width="3" fill="none"><path d="M70 28v28M100 30v34M160 33v30M195 34v38M250 34v24"/></g>
<g class="cherries">
<g class="cherry"><ellipse cx="70" cy="72" rx="15" ry="19" fill="var(--c1)"/><ellipse cx="65" cy="65" rx="4" ry="6" fill="#fff" opacity=".35"/></g>
<g class="cherry"><ellipse cx="100" cy="82" rx="15" ry="19" fill="var(--c1)"/><ellipse cx="95" cy="75" rx="4" ry="6" fill="#fff" opacity=".35"/></g>
<g class="cherry"><ellipse cx="160" cy="78" rx="15" ry="19" fill="#8DBA3F"/><ellipse cx="155" cy="71" rx="4" ry="6" fill="#fff" opacity=".35"/></g>
<g class="cherry"><ellipse cx="195" cy="90" rx="15" ry="19" fill="var(--c1)"/><ellipse cx="190" cy="83" rx="4" ry="6" fill="#fff" opacity=".35"/></g>
<g class="cherry"><ellipse cx="250" cy="74" rx="15" ry="19" fill="#F0A020"/><ellipse cx="245" cy="67" rx="4" ry="6" fill="#fff" opacity=".35"/></g>
</g>
</svg>
</div>
<div class="stat"><div>คะแนน <span id="score">0</span></div><span id="net">กำลังเตรียมโหมดออฟไลน์…</span></div>
<div class="missions" id="missions"></div>
<section class="card target"><h2 id="tname"></h2><p id="tdesc"></p>
<div class="compare" id="cmp"><div class="sw" id="swT"><div>สีเป้าหมาย<small id="tHex"></small></div></div><div class="sw" id="swP"><div>สีของคุณ<small id="pHex"></small></div></div></div></section>
<section class="card" aria-label="ปรับสี">
<div class="row"><label for="hue">เฉดสี</label><input id="hue" type="range" min="0" max="360"></div>
<div class="row"><label for="sat">ความอิ่มตัว</label><input id="sat" type="range" min="0" max="100"></div>
<div class="row"><label for="lit">ความสว่าง</label><input id="lit" type="range" min="0" max="100"></div>
<div class="row"><label for="hex">HEX</label><input id="hex" maxlength="7" autocomplete="off" spellcheck="false" inputmode="text"></div>
<div class="row tol"><label for="tol" style="width:auto">ความคลาดเคลื่อน</label><input id="tol" type="range" min="10" max="20" step="1"><output id="tolOut">15%</output></div>
</section>
<div id="status" role="status" aria-live="polite"><div class="ic" id="ic">?</div><div><b id="msg"></b><small id="sub"></small></div></div>
<div class="btns"><button class="btn alt" id="reset">เริ่มใหม่</button><button class="btn" id="next" hidden>ภารกิจถัดไป</button></div>
<p class="note" id="deltaNote"></p>
<p class="note" id="install" hidden></p>
<button class="link" id="wipe">ล้างคะแนนทั้งหมด</button>
</main>
<script>
const MISSIONS=[
{name:'Ripe Coffee Cherry Red',desc:'สีแดงสดของผลกาแฟที่สุกเต็มที่',hex:'#E10600'},
{name:'Semi-ripe Cherry Orange',desc:'ผลกาแฟที่กำลังเปลี่ยนสี ใกล้สุก',hex:'#F28A00'},
{name:'Unripe Cherry Green',desc:'ผลกาแฟดิบ ยังไม่ควรเก็บ',hex:'#6FA33A'}];
const $=id=>document.getElementById(id);
let S={score:0,done:[],unlocked:1,tol:15,mission:0};
/* ---------- IndexedDB ---------- */
const DB=new Promise((res,rej)=>{try{const r=indexedDB.open('cherry-hunter',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const idb=(m,k,v)=>DB.then(db=>new Promise((res,rej)=>{const s=db.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv');const q=m==='get'?s.get(k):s.put(v,k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})).catch(()=>null);
const save=()=>idb('put','state',S);
/* ---------- Color math ---------- */
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function rgb2lab([r,g,b]){const l=c=>{c/=255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)};
const R=l(r),G=l(g),B=l(b);
const x=(.4124564*R+.3575761*G+.1804375*B)/.95047,y=.2126729*R+.7151522*G+.072175*B,z=(.0193339*R+.119192*G+.9503041*B)/1.08883;
const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;return[116*f(y)-16,500*(f(x)-f(y)),200*(f(y)-f(z))]}
function de2000(p,q){const[L1,a1,b1]=p,[L2,a2,b2]=q,d=Math.PI/180,h=Math.hypot,
hp=(b,a)=>(b===0&&a===0)?0:(Math.atan2(b,a)/d+360)%360;
const Cb=(h(a1,b1)+h(a2,b2))/2,G=.5*(1-Math.sqrt(Cb**7/(Cb**7+25**7))),
a1p=(1+G)*a1,a2p=(1+G)*a2,C1=h(a1p,b1),C2=h(a2p,b2),h1=hp(b1,a1p),h2=hp(b2,a2p);
const dL=L2-L1,dC=C2-C1;let dh=0;
if(C1*C2){dh=h2-h1;if(dh>180)dh-=360;else if(dh<-180)dh+=360}
const dH=2*Math.sqrt(C1*C2)*Math.sin(dh*d/2),Lb=(L1+L2)/2,Cp=(C1+C2)/2;
let hb=h1+h2;if(C1*C2){if(Math.abs(h1-h2)>180)hb+=hb<360?360:-360;hb/=2}
const T=1-.17*Math.cos((hb-30)*d)+.24*Math.cos(2*hb*d)+.32*Math.cos((3*hb+6)*d)-.2*Math.cos((4*hb-63)*d);
const dT=30*Math.exp(-(((hb-275)/25)**2)),Rc=2*Math.sqrt(Cp**7/(Cp**7+25**7)),
Sl=1+.015*(Lb-50)**2/Math.sqrt(20+(Lb-50)**2),Sc=1+.045*Cp,Sh=1+.015*Cp*T,Rt=-Math.sin(2*dT*d)*Rc;
return Math.sqrt((dL/Sl)**2+(dC/Sc)**2+(dH/Sh)**2+Rt*(dC/Sc)*(dH/Sh))}
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase()}
function hex2hsl(hex){let[r,g,b]=hexRGB(hex).map(x=>x/255);const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;
let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}
return[Math.round(h),Math.round(s*100),Math.round(l*100)]}
/* tolerance % -> CIEDE2000 limit: 10%=4, 15%=6, 20%=8 */
const limit=()=>S.tol*0.4;
/* ---------- UI ---------- */
let cur='#808080',lastPass=false;
const M=()=>MISSIONS[S.mission];
function paintMissions(){const box=$('missions');box.innerHTML='';
MISSIONS.forEach((m,i)=>{const b=document.createElement('button');b.textContent=(S.done.includes(i)?'✓ ':i<S.unlocked?'':'🔒 ')+'ภารกิจ '+(i+1);b.disabled=i>=S.unlocked;
b.setAttribute('aria-current',i===S.mission);b.onclick=()=>{S.mission=i;save();loadMission(true)};box.appendChild(b)})}
function loadMission(resetPick){const m=M();$('tname').textContent=m.name;$('tdesc').textContent=m.desc;
$('swT').style.background=m.hex;$('tHex').textContent=m.hex;document.documentElement.style.setProperty('--c1',m.hex);
$('score').textContent=S.score;$('tol').value=S.tol;$('tolOut').textContent=S.tol+'%';paintMissions();
if(resetPick)setColor('#808080',true);else evaluate()}
function setColor(hex,syncAll){cur=hex.toUpperCase();const[h,s,l]=hex2hsl(cur);
if(syncAll){$('hue').value=h;$('sat').value=s;$('lit').value=l}
$('hex').value=cur;evaluate()}
function evaluate(){const m=M(),pl=rgb2lab(hexRGB(cur)),tl=rgb2lab(hexRGB(m.hex)),de=de2000(pl,tl),lim=limit();
$('swP').style.background=cur;$('pHex').textContent=cur;
const st=$('status'),ic=$('ic');
const dL=pl[0]-tl[0],Cp=Math.hypot(pl[1],pl[2]),Ct=Math.hypot(tl[1],tl[2]),dC=Cp-Ct;
let dh=Math.atan2(pl[2],pl[1])*180/Math.PI-Math.atan2(tl[2],tl[1])*180/Math.PI;dh=((dh+540)%360)-180;
const sc=[[Math.abs(dL)/8,0],[Math.abs(dC)/12,1],[Math.abs(dh)/8*(Ct>20?1:0),2]].sort((a,b)=>b[0]-a[0])[0][1];
let hint=sc===0?(dL>0?'สีสว่างไปนิด ลองทำให้เข้มขึ้น':'สีมืดไปนิด ลองทำให้สว่างขึ้น'):
sc===1?(dC>0?'สีสดเกินไป ลองลดความอิ่มตัวลง':'สีจางไป ลองเพิ่มความอิ่มตัว'):
(dh>0?'เฉดออกไปทางเหลือง/ส้มมากไป ลองปรับให้แดงขึ้น':'เฉดออกไปทางม่วง/ชมพูมากไป ลองปรับให้อุ่นขึ้น');
$('deltaNote').textContent='ΔE (CIEDE2000) = '+de.toFixed(1)+' · ผ่านเมื่อ ≤ '+lim.toFixed(1)+' (ความคลาดเคลื่อน '+S.tol+'%)';
let pass=false;
if(de<=lim){pass=true;st.className='pass';ic.textContent='✓';$('msg').textContent='ถูกต้อง! คุณพบสีของผลกาแฟสุกแล้ว!';
 let first=!S.done.includes(S.mission);
 if(first){S.done.push(S.mission);S.score+=100;if(S.unlocked<MISSIONS.length&&S.unlocked===S.mission+1)S.unlocked++;save();$('score').textContent=S.score;paintMissions()}
 $('sub').textContent=first?'+100 คะแนน':'ผ่านภารกิจนี้แล้ว';
 $('next').hidden=S.mission>=MISSIONS.length-1;
 if(!lastPass){['swP','ic'].forEach(i=>{const e=$(i);e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')});
  const hr=$('hero');hr.classList.remove('bounce');void hr.offsetWidth;hr.classList.add('bounce')}}
else{$('next').hidden=true;
 if(de<=lim*2){st.className='near';ic.textContent='!';$('msg').textContent='ใกล้แล้ว! ลองปรับเฉดสีอีกนิด';$('sub').textContent=hint}
 else{st.className='bad';ic.textContent='✕';$('msg').textContent='ยังไม่ใช่สีของผลกาแฟสุก ลองอีกครั้ง!';$('sub').textContent=''}}
lastPass=pass}
['hue','sat','lit'].forEach(id=>$(id).addEventListener('input',()=>setColor(hsl2hex(+$('hue').value,+$('sat').value,+$('lit').value),false)));
$('hex').addEventListener('input',e=>{let v=e.target.value.trim();if(v[0]!=='#')v='#'+v;if(/^#[0-9a-fA-F]{6}$/.test(v))setColor(v,true)});
$('tol').addEventListener('input',e=>{S.tol=+e.target.value;$('tolOut').textContent=S.tol+'%';save();lastPass=true;evaluate()});
$('reset').onclick=()=>{lastPass=false;setColor('#808080',true)};
$('next').onclick=()=>{S.mission=Math.min(S.mission+1,S.unlocked-1);save();lastPass=false;loadMission(true)};
$('wipe').onclick=()=>{if(confirm('ล้างคะแนนและภารกิจที่ปลดล็อกทั้งหมด?')){S={score:0,done:[],unlocked:1,tol:15,mission:0};save();lastPass=false;loadMission(true)}};
/* ---------- Offline / install ---------- */
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('net').textContent='พร้อมเล่นออฟไลน์'}).catch(()=>{$('net').textContent=''})}else $('net').textContent='';
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const n=$('install');
 if(ios){n.hidden=false;n.textContent='ติดตั้งบน iPhone: เปิดใน Safari กดปุ่มแชร์ แล้วเลือก "เพิ่มลงหน้าจอโฮม"'}
 else addEventListener('beforeinstallprompt',e=>{e.preventDefault();n.hidden=false;n.innerHTML='<button class="btn" style="width:100%">ติดตั้งแอป</button>';n.firstChild.onclick=()=>{e.prompt();n.hidden=true}})}
/* ---------- Start ---------- */
(async()=>{const s=await idb('get','state');if(s)S=Object.assign(S,s);S.mission=Math.min(S.mission,S.unlocked-1);loadMission(true)})();
</script>
</body>
</html>
